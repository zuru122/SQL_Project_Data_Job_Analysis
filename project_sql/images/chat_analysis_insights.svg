<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT analysis of data analyst job market results</title>
  <desc id="desc">Four chat-style insight cards summarizing top-paying role skills, demand, salary, and optimal skills.</desc>
  <rect width="1200" height="1500" fill="#f4f7fb"/>
  <rect x="55" y="45" width="1090" height="1410" rx="28" fill="#ffffff" stroke="#d9e2ec" stroke-width="3"/>
  <rect x="55" y="45" width="1090" height="145" rx="28" fill="#172b4d"/>
  <rect x="55" y="115" width="1090" height="75" fill="#172b4d"/>
  <circle cx="115" cy="112" r="28" fill="#3b82f6"/>
  <path d="M101 112h28M115 98v28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="165" y="105" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">ChatGPT analysis</text>
  <text x="165" y="140" font-family="Arial, sans-serif" font-size="20" fill="#b9c8dc">Data Analyst job market project</text>

  <text x="105" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b">TOP-PAYING ROLE SKILLS</text>
  <rect x="105" y="270" width="800" height="180" rx="22" fill="#eaf2ff"/>
  <polygon points="905,365 935,382 905,399" fill="#eaf2ff"/>
  <text x="140" y="315" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">SQL appeared in all 8 roles with skill data.</text>
  <text x="140" y="352" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Python appeared in 7 and Tableau in 6.</text>
  <text x="140" y="402" font-family="Arial, sans-serif" font-size="23" fill="#334155">Cloud and big-data tools support senior roles.</text>

  <text x="295" y="500" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b">MOST IN-DEMAND SKILLS</text>
  <rect x="295" y="525" width="800" height="180" rx="22" fill="#e8f8f1"/>
  <polygon points="295,620 265,637 295,654" fill="#e8f8f1"/>
  <text x="330" y="570" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">SQL leads remote postings with 7,291.</text>
  <text x="330" y="607" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Excel, Python, Tableau, and Power BI follow.</text>
  <text x="330" y="657" font-family="Arial, sans-serif" font-size="23" fill="#334155">Analysts need both technical and visual skills.</text>

  <text x="105" y="755" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b">SALARY ASSOCIATIONS</text>
  <rect x="105" y="780" width="800" height="180" rx="22" fill="#fff3df"/>
  <polygon points="905,875 935,892 905,909" fill="#fff3df"/>
  <text x="140" y="825" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Specialized cloud, database, and programming</text>
  <text x="140" y="862" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">skills were associated with higher averages.</text>
  <text x="140" y="912" font-family="Arial, sans-serif" font-size="23" fill="#334155">Correlation does not prove causation.</text>

  <text x="295" y="1010" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b">OPTIMAL SKILLS TO LEARN</text>
  <rect x="295" y="1035" width="800" height="205" rx="22" fill="#f2eaff"/>
  <polygon points="295,1140 265,1157 295,1174" fill="#f2eaff"/>
  <text x="330" y="1080" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Python offers a strong demand/pay balance:</text>
  <text x="330" y="1117" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">236 postings and about $101,397 average salary.</text>
  <text x="330" y="1167" font-family="Arial, sans-serif" font-size="23" fill="#334155">Learn SQL, Excel, Python, and visualization first.</text>
  <text x="330" y="1203" font-family="Arial, sans-serif" font-size="23" fill="#334155">Then add cloud or warehouse skills.</text>

  <line x1="105" y1="1300" x2="1095" y2="1300" stroke="#e2e8f0" stroke-width="3"/>
  <text x="105" y="1350" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b4d">Recommended roadmap</text>
  <text x="105" y="1390" font-family="Arial, sans-serif" font-size="22" fill="#475569">SQL → Excel → Python → Tableau/Power BI → Cloud platforms</text>
</svg>
